<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сайт по информатике</title>
    <script>
        
        if (sessionStorage.getItem("auth") !== "yes") {
            window.location.href = "index.html";
        }
    </script>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 800px; margin: auto; }
        img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Мой сайт по информатике</h1>
    <p>Здесь будет весь ваш контент — текст, картинки, что угодно.</p>

   
    <img src="photo.jpg" alt="Моё фото">

    <p><a href="index.html" onclick="sessionStorage.removeItem('auth')">Выйти</a></p>
</body>
</html>
